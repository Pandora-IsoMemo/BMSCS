# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: |
            Pandora = https://Pandora-IsoMemo.github.io/drat/
            stan-dev = https://stan-dev.r-universe.dev

      # test fixes for stan-dev/rstan#1145 (tbb_stddef.h removed by oneTBB) and StanHeaders
      # moving stan/version.hpp into include/src, before applying them upstream in BMSC's Makevars.win
      - name: Shim legacy tbb_stddef.h and StanHeaders/include/src for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tbbDir = "$env:USERPROFILE/tbb_fix/tbb".Replace('\', '/')
          New-Item -ItemType Directory -Force -Path $tbbDir | Out-Null
          Set-Content -Path "$tbbDir/tbb_stddef.h" -Value '#include <tbb/version.h>'

          $fixPath = "$env:USERPROFILE/tbb_fix".Replace('\', '/')
          $line = "CPPFLAGS += -I""$fixPath"" `$(subst /StanHeaders/include,/StanHeaders/include/src,`$(CLINK_CPPFLAGS))"

          $targets = @("$env:USERPROFILE\.R", "$env:USERPROFILE\Documents\.R")
          foreach ($dir in $targets) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Add-Content -Path "$dir\Makevars.win" -Value $line
            Write-Host "Appended to $dir\Makevars.win: $line"
          }

      - name: Show R version
        run: |
          echo "Matrix R selector: ${{ matrix.config.r }}"
          Rscript -e 'cat("Resolved R version:", R.version.string, "\n")'
          Rscript -e 'cat("Repositories:\n"); print(getOption("repos"))'
      
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: true
          cache-version: 2

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
