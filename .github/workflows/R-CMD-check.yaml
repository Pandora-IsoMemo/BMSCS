# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: |
            Pandora = https://Pandora-IsoMemo.github.io/drat/
            stan-dev = https://stan-dev.r-universe.dev

      - name: Configure Makevars for StanHeaders on Windows
        if: runner.os == 'Windows'
        run: |
          Rscript -e '
            mv_line <- "PKG_CPPFLAGS += $(subst /StanHeaders/include,/StanHeaders/include/src,$(CLINK_CPPFLAGS))"
            etc_site <- file.path(R.home("etc"), "Makevars.site")
            writeLines(mv_line, etc_site)
            cat("Wrote to", etc_site, ":\n")
            writeLines(readLines(etc_site))
            
            user_dir <- file.path(path.expand("~"), ".R")
            dir.create(user_dir, showWarnings = FALSE, recursive = TRUE)
            user_mv <- file.path(user_dir, "Makevars.win")
            writeLines(mv_line, user_mv)
            cat("Wrote to", user_mv, ":\n")
            writeLines(readLines(user_mv))
          '
        shell: bash

      - name: Show R version
        run: |
          echo "Matrix R selector: ${{ matrix.config.r }}"
          Rscript -e 'cat("Resolved R version:", R.version.string, "\n")'
          Rscript -e 'cat("Repositories:\n"); print(getOption("repos"))'
      
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: true
          cache-version: 2

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
